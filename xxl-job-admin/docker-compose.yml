version: "3.8"

# xxl-job-admin 部署到 192.168.1.254
# 数据库复用 .254 上已有的 MySQL 8.4（xxl_job 库已导入建表脚本，专用账号 xxljob 已创建）
# 启动： docker compose up -d
# 控制台： http://192.168.1.254:8081/xxl-job-admin   默认账号 admin / 123456

services:
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: xxl-job-admin
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://192.168.1.254:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull
        --spring.datasource.username=xxljob
        --spring.datasource.password=XxlJob2026Kge#Db
        --xxl.job.accessToken=kgeXxlJob2026Token
        --xxl.job.i18n=zh_CN
        --server.servlet.context-path=/xxl-job-admin
    # 若 MySQL 也跑在本机 Docker，可改用宿主机网关地址：
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # 并把上面 url 中的 192.168.1.254 换成 host.docker.internal
