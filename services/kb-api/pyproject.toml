[project]
name = "kb-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "kb-common",
    "uvicorn[standard]>=0.29",
    "python-docx>=1.0",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "apscheduler>=3.10",
    "psycopg[binary]>=3.1",
    "dingtalk-stream>=0.24",
    "pyyaml>=6.0",
    "pillow>=10.4",
]
[tool.uv.sources]
kb-common = { path = "../kb-common", editable = true }
