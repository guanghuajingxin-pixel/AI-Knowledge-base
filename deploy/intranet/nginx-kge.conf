# 知识治理平台前端（部署在 8080，80 端口常被服务器其他服务占用）
server {
    listen 8080;
    server_name _;
    root /opt/kge/web/dist;
    index index.html;

    client_max_body_size 100M;

    # FAQ 服务（更长前缀优先匹配，原路径透传）
    location /api/v1/faq {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # kb-api（含智能问答 SSE 长连接）
    location /api/v1 {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # /api/* 兜底：所有以 /api 开头但未命中上面显式 location 的请求（例如
    # 前端把 /api/v1/mineru 拼成 /api/mineru、少写 v1 段等）都 proxy 给 kb-api，
    # 由 FastAPI 返回结构化 JSON 404；否则会被下方 location / 的 try_files 命中，
    # nginx 静态文件处理器对非 GET/HEAD 方法直接返回 HTML 405（很难排查）。
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # SPA 前端
    location / {
        try_files $uri $uri/ /index.html;
    }
}
